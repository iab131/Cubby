# Supabase's free plan pauses a project after 7 days with no activity.
# This asks the database for one row every 3 days so it stays awake.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (your publishable or anon key)
# (GitHub repo > Settings > Secrets and variables > Actions > New repository secret).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Supabase for one room
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sSf "$SUPABASE_URL/rest/v1/rooms?select=px&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase is awake."
